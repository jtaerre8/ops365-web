  <g transform="translate(20, 28)">
    <rect x="0" y="48" width="10" height="16" fill="#FF7A1A"/>
    <rect x="14" y="36" width="10" height="28" fill="#0C3B6E"/>
    <rect x="28" y="22" width="10" height="42" fill="#0C3B6E" opacity="0.75"/>
